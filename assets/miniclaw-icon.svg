<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="110" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2744"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 450) rotate(90) scale(520)">
      <stop stop-color="#2B4478" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2B4478" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="300" y1="300" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F5F8FF"/>
      <stop offset="0.76" stop-color="#CFE0FF"/>
      <stop offset="1" stop-color="#7F9CFF"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8FE8FF"/>
      <stop offset="0.55" stop-color="#6DBEFF"/>
      <stop offset="1" stop-color="#8B7DFF"/>
    </linearGradient>
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#02050B" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <g filter="url(#softShadow)">
    <rect x="246" y="310" width="532" height="414" rx="207" fill="url(#shell)"/>
    <rect x="344" y="404" width="336" height="226" rx="113" fill="#0B1020"/>
    <rect x="345" y="405" width="334" height="224" rx="112" stroke="#24345A" stroke-opacity="0.72" stroke-width="2"/>
  </g>
  <g filter="url(#eyeGlow)">
    <rect x="438" y="475" width="48" height="112" rx="24" fill="url(#eye)"/>
    <rect x="538" y="475" width="48" height="112" rx="24" fill="url(#eye)"/>
  </g>
</svg>
